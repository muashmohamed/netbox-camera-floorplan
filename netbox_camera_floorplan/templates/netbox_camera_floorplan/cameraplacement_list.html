{% extends 'generic/object_list.html' %}
{% block title %}Device Placements{% endblock %}

{% block content %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Adds collapsible Site-based group headers on top of the existing
  // table, purely as a client-side visual layer — it doesn't touch how
  // NetBox renders the table, so sorting, pagination, bulk select, and
  // CSV export all keep working exactly as before.
  var table = document.querySelector('.card table, table.table');
  if(!table) return;
  var tbody = table.querySelector('tbody');
  if(!tbody) return;

  var headerCells = Array.from(table.querySelectorAll('thead th'));
  var floorplanColIndex = headerCells.findIndex(function(th){
    return th.textContent.trim().toLowerCase().indexOf('floorplan') !== -1;
  });
  if(floorplanColIndex === -1) return;

  var dataRows = Array.from(tbody.querySelectorAll('tr'));
  if(!dataRows.length) return;

  var currentSite = null;
  var groupIndex = 0;

  dataRows.forEach(function(row){
    var cells = row.querySelectorAll('td');
    if(!cells[floorplanColIndex]) return;
    // The Floorplan column renders as "Site / Location / Floor Plan Name"
    var siteName = cells[floorplanColIndex].textContent.trim().split('/')[0].trim();
    if(!siteName) return;

    if(siteName !== currentSite){
      currentSite = siteName;
      groupIndex++;
      var headerRow = document.createElement('tr');
      headerRow.className = 'cfp-group-header';
      headerRow.style.cursor = 'pointer';
      headerRow.style.background = 'var(--tblr-bg-surface-secondary, #f2f4f6)';
      var td = document.createElement('td');
      td.colSpan = headerCells.length;
      td.style.fontWeight = '600';
      td.innerHTML = '<span class="cfp-group-arrow">▾</span> ' + siteName;
      headerRow.appendChild(td);
      row.parentNode.insertBefore(headerRow, row);
    }
    row.dataset.cfpGroup = 'g' + groupIndex;
  });

  tbody.querySelectorAll('.cfp-group-header').forEach(function(headerRow){
    headerRow.addEventListener('click', function(){
      var arrow = headerRow.querySelector('.cfp-group-arrow');
      var collapsing = arrow.textContent.trim() === '▾';
      arrow.textContent = collapsing ? '▸' : '▾';
      var sibling = headerRow.nextElementSibling;
      while(sibling && !sibling.classList.contains('cfp-group-header')){
        sibling.style.display = collapsing ? 'none' : '';
        sibling = sibling.nextElementSibling;
      }
    });
  });
});
</script>
{% endblock %}

{% extends 'generic/object_edit.html' %}

{% block content %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Tie the "field of view" choice to the type being picked, so it's a
  // deliberate step rather than a silently-applied default. Based on
  // real-world camera specs: Dome ~90-120° (we use 90 as baseline),
  // Bullet ~70-110° (80 as a representative middle value), PTZ varies
  // hugely with zoom (~5° zoomed in to ~55-90° zoomed out — 60 as a
  // moderately-zoomed-out default), Fisheye commonly 180° hemispherical.
  // Always editable afterward.
  var FOV_BY_PRESET = { dome: 90, bullet: 80, ptz: 60, fisheye: 180, generic: 90 };
  // Maps each built-in preset icon to the EquipmentCategory *slug* it
  // should suggest when picked (e.g. picking the AP icon suggests the
  // "Access Point" category) — mirrors CameraType.PRESET_SUGGESTED_CATEGORY_SLUG
  // in models.py. Kept as slugs (not raw category objects) since the
  // actual category select's values are database IDs, which this page
  // resolves via EQUIPMENT_CATEGORIES below.
  var CATEGORY_SLUG_BY_PRESET = {{ preset_category_slugs_json|safe }};
  // [{id, slug, is_camera, is_hub}, ...] for every EquipmentCategory —
  // lets this page look up a category's flags by its select value (an
  // ID), since the <select> itself only carries IDs, not semantics.
  var EQUIPMENT_CATEGORIES = {{ equipment_categories_json|safe }};

  var presetSelect = document.getElementById('id_preset_icon');
  var fovInput = document.getElementById('id_fov_degrees');
  var channelInput = document.getElementById('id_channel_capacity');
  var categorySelect = document.getElementById('id_category');

  function categoryById(id){
    return EQUIPMENT_CATEGORIES.find(function(c){ return String(c.id) === String(id); });
  }

  function categoryIdBySlug(slug){
    var match = EQUIPMENT_CATEGORIES.find(function(c){ return c.slug === slug; });
    return match ? match.id : undefined;
  }

  // Hides/shows a field (by its #id_<name> input) plus its <label> and any
  // help-text/form-text sibling, based on a predicate over the current
  // category. Generalized so both FOV (camera-only) and channel capacity
  // (hub-only) share one implementation instead of two near-duplicates.
  function toggleFieldVisibility(inputEl, shouldShow){
    if(!inputEl) return;
    var display = shouldShow ? '' : 'none';
    // Hide the input itself directly rather than guessing at NetBox's
    // field-wrapper class (uncertain and proved unreliable) — this part
    // is unambiguous regardless of surrounding markup.
    inputEl.style.display = display;
    var label = document.querySelector('label[for="' + inputEl.id + '"]');
    if(label) label.style.display = display;
    // NetBox typically renders help text as a small/form-text element
    // right after the input, inside the same wrapper — hide that too.
    if(inputEl.parentElement){
      inputEl.parentElement.querySelectorAll('.form-text, small').forEach(function(el){
        el.style.display = display;
      });
    }
  }

  function applyVisibility(){
    if(!categorySelect) return;
    var current = categoryById(categorySelect.value);
    toggleFieldVisibility(fovInput, !!(current && current.is_camera));
    toggleFieldVisibility(channelInput, !!(current && current.is_hub));
  }

  if(presetSelect){
    presetSelect.addEventListener('change', function() {
      var suggestedFov = FOV_BY_PRESET[presetSelect.value];
      if(suggestedFov !== undefined && fovInput){
        fovInput.value = suggestedFov;
      }
      var suggestedSlug = CATEGORY_SLUG_BY_PRESET[presetSelect.value];
      var suggestedId = suggestedSlug !== undefined ? categoryIdBySlug(suggestedSlug) : undefined;
      if(suggestedId !== undefined && categorySelect){
        categorySelect.value = suggestedId;
        applyVisibility();
      }
    });
  }

  if(categorySelect){
    categorySelect.addEventListener('change', applyVisibility);
    categorySelect.addEventListener('input', applyVisibility);
    applyVisibility(); // reflect the correct state immediately, including when editing an existing type
  }
});
</script>
{% endblock %}

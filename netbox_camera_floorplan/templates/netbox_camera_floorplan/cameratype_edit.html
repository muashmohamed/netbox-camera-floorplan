{% extends 'generic/object_edit.html' %}

{% block content %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Tie the "field of view" choice to the type being picked, so it's a
  // deliberate step rather than a silently-applied default. Based on
  // real-world camera specs: Dome ~90-120° (we use 90 as baseline),
  // Bullet ~70-110° (80 as a representative middle value), PTZ varies
  // hugely with zoom (~5° zoomed in to ~55-90° zoomed out — 60 as a
  // moderately-zoomed-out default), Fisheye commonly 180° hemispherical.
  // Always editable afterward.
  var FOV_BY_PRESET = { dome: 90, bullet: 80, ptz: 60, fisheye: 180, generic: 90 };
  // Picking a preset also suggests the matching category, since a Dome
  // icon obviously means "Camera" and an AP icon obviously means
  // "Access Point" — one less thing to remember to set separately.
  var CATEGORY_BY_PRESET = {
    dome: 'camera', bullet: 'camera', ptz: 'camera', fisheye: 'camera',
    ap: 'ap', access_control: 'access_control', switch: 'switch', ups: 'ups',
    server: 'server', router: 'router', firewall: 'firewall',
    nvr: 'nvr', ont: 'ont', modem: 'modem',
    generic: 'camera',
  };
  var presetSelect = document.getElementById('id_preset_icon');
  var fovInput = document.getElementById('id_fov_degrees');
  var categorySelect = document.getElementById('id_category');

  function toggleFovVisibility(){
    if(!categorySelect || !fovInput) return;
    var isCamera = categorySelect.value === 'camera';
    var display = isCamera ? '' : 'none';
    // Hide the input itself directly rather than guessing at NetBox's
    // field-wrapper class (uncertain and proved unreliable) — this part
    // is unambiguous regardless of surrounding markup.
    fovInput.style.display = display;
    var label = document.querySelector('label[for="id_fov_degrees"]');
    if(label) label.style.display = display;
    // NetBox typically renders help text as a small/form-text element
    // right after the input, inside the same wrapper — hide that too.
    if(fovInput.parentElement){
      fovInput.parentElement.querySelectorAll('.form-text, small').forEach(function(el){
        el.style.display = display;
      });
    }
  }

  if(presetSelect){
    presetSelect.addEventListener('change', function() {
      var suggestedFov = FOV_BY_PRESET[presetSelect.value];
      if(suggestedFov !== undefined && fovInput){
        fovInput.value = suggestedFov;
      }
      var suggestedCategory = CATEGORY_BY_PRESET[presetSelect.value];
      if(suggestedCategory !== undefined && categorySelect){
        categorySelect.value = suggestedCategory;
        toggleFovVisibility();
      }
    });
  }

  if(categorySelect){
    categorySelect.addEventListener('change', toggleFovVisibility);
    categorySelect.addEventListener('input', toggleFovVisibility);
    toggleFovVisibility(); // reflect the correct state immediately, including when editing an existing type
  }
});
</script>
{% endblock %}

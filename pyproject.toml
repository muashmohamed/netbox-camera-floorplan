[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-camera-floorplan"
version = "0.3.0"
description = "Place CCTV cameras on floor plan images inside NetBox, with live uplink and power lookups."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["netbox_camera_floorplan*"]

[tool.setuptools.package-data]
netbox_camera_floorplan = [
    "templates/**/*.html",
    "static/**/*",
]

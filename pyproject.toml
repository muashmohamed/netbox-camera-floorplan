[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-camera-floorplan"
version = "0.3.0"
description = "Place devices (cameras, APs, access control, switches, UPS) on floor plan images inside NetBox, with live uplink/power lookups, reachability, and PDF import/export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "PyMuPDF>=1.23",
]

[tool.setuptools.packages.find]
include = ["netbox_camera_floorplan*"]

[tool.setuptools.package-data]
netbox_camera_floorplan = [
    "templates/**/*.html",
    "static/**/*",
]
